<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">Vincent — a Discord bot with a memory and a mind of his own</title><desc id="desc">Dark editorial banner with a stylized V monogram and a conversational diagram.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10120f"/><stop offset="1" stop-color="#090b0a"/></linearGradient><radialGradient id="glow"><stop stop-color="#b5e67c" stop-opacity=".17"/><stop offset="1" stop-color="#b5e67c" stop-opacity="0"/></radialGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs>
<rect width="1440" height="540" rx="20" fill="url(#bg)"/><rect width="1440" height="540" rx="20" fill="url(#grid)"/><circle cx="1100" cy="235" r="350" fill="url(#glow)"/>
<path d="M75 70h22v22H75z" fill="#c7ed9d"/><text x="113" y="87" fill="#a7b59c" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="4">A DISCORD EXPERIMENT</text>
<text x="70" y="241" fill="#f2f4ed" font-family="Georgia,serif" font-size="142" letter-spacing="-8">vincent<tspan fill="#c7ed9d">.</tspan></text>
<text x="77" y="303" fill="#c5cbc0" font-family="Arial,sans-serif" font-size="25">A little personality. A lot of context.</text>
<text x="78" y="345" fill="#7f8b7c" font-family="Arial,sans-serif" font-size="16">A memory-aware Discord bot built for the conversation.</text>
<rect x="77" y="409" width="180" height="38" rx="19" fill="#c7ed9d"/><text x="101" y="433" fill="#10150e" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="1.8">PERSONALITY FIRST</text>
<rect x="270" y="409" width="155" height="38" rx="19" fill="none" stroke="#4b5946"/><text x="292" y="433" fill="#b5c3ae" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="1.6">LOCALLY MINDED</text>
<rect x="824" y="95" width="480" height="350" rx="18" fill="#121612" stroke="#354032"/><rect x="824" y="95" width="480" height="53" rx="18" fill="#1b211a"/><path d="M824 130h480v18H824z" fill="#1b211a"/><circle cx="853" cy="121" r="5" fill="#c7ed9d"/><text x="872" y="125" fill="#aebda6" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="2">VINCENT / CONTEXT ENGINE</text><text x="1238" y="125" fill="#667263" font-family="Arial,sans-serif" font-size="11">01 — 04</text>
<rect x="851" y="174" width="307" height="58" rx="9" fill="#252d23"/><circle cx="880" cy="203" r="10" fill="#738a6c"/><text x="900" y="200" fill="#d7ded2" font-family="Arial,sans-serif" font-size="13">A message arrives</text><text x="900" y="217" fill="#869482" font-family="Arial,sans-serif" font-size="11">who, where, and what just happened</text>
<path d="M1000 232v23" stroke="#a9d889" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="913" y="255" width="340" height="67" rx="9" fill="#c7ed9d"/><text x="936" y="282" fill="#172016" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Find the right context.</text><text x="936" y="302" fill="#4a6043" font-family="Arial,sans-serif" font-size="11">memory  /  timing  /  conversation</text>
<path d="M1080 322v22" stroke="#a9d889" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="851" y="344" width="352" height="69" rx="9" fill="#20281f"/><text x="874" y="372" fill="#d7ded2" font-family="Arial,sans-serif" font-size="13">One reply, in character.</text><text x="874" y="393" fill="#869482" font-family="Arial,sans-serif" font-size="11">or silence, when the moment calls for it</text>
<text x="78" y="495" fill="#596454" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">PYTHON  /  SQLITE  /  DISCORD  /  OPENROUTER</text></svg>
